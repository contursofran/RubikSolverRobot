[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rubik-solver-robot"
version = "1.0.0"
description = "Archived Rubik's Cube solver robot protocol tools"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["arduino", "robotics", "rubiks-cube", "serial"]
classifiers = [
  "Development Status :: 7 - Inactive",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
solver = ["kociemba>=1.2.1,<2"]
hardware = ["pyserial>=3.5,<4"]
all = ["kociemba>=1.2.1,<2", "pyserial>=3.5,<4"]

[project.scripts]
rubik-robot = "rubik_solver_robot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
